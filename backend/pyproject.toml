[project]
name = "ai-chatbot-backend"
version = "0.4.0"
description = "FastAPI + LangGraph backend for the AI Chatbot"
readme = "../README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "PyYAML>=6.0",
    # LLM / agents
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "openai>=2.0",
    # Web search
    "tavily-python>=0.7",
    # Uploads
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
    # Timezones on Windows (zoneinfo needs this data there)
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
# This is an application, not a library: don't build/install it as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
