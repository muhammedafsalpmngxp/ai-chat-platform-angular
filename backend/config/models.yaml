# Model catalog shown in the model picker.
# Prices are USD per 1M tokens (OpenAI Standard tier), as provided on 2026-11-20.
# Update this file when OpenAI changes pricing; nothing else needs to change.
#
# tier:
#   premium     -> cost warning + re-enter password before use
#   standard    -> normal
#   recommended -> green "Recommended" badge
#   low         -> yellow warning ("not good, use recommended models")

prices_as_of: "2026-11-20"
default_model: gpt-6-luna

models:
  - id: gpt-6.2-astra
    label: GPT-6.2 Astra
    tier: premium
    input_price: 8.00
    output_price: 40.00
    cached_input_price: 0.40
    requires_reauth: true
    warning: "Premium model: about 80x the price per token of GPT-6 Luna."

  - id: gpt-6.2-sol
    label: GPT-6.2 Sol
    tier: standard
    input_price: 2.00
    output_price: 10.00
    cached_input_price: 0.10

  - id: gpt-6.1-terra
    label: GPT-6.1 Terra
    tier: standard
    input_price: 1.00
    output_price: 5.00
    cached_input_price: 0.05

  - id: gpt-6-luna
    label: GPT-6 Luna
    tier: recommended
    input_price: 0.10
    output_price: 0.50
    cached_input_price: 0.01

  - id: gpt-5.6-luna
    label: GPT-5.6 Luna
    tier: low
    input_price: 0.20
    output_price: 1.20
    cached_input_price: 0.02
    warning: "These models are not good. Use a recommended model for better results and optimum price."

  - id: gpt-5.4-mini
    label: GPT-5.4 Mini
    tier: low
    input_price: 0.75
    output_price: 4.50
    cached_input_price: 0.075
    warning: "These models are not good. Use a recommended model for better results and optimum price."
