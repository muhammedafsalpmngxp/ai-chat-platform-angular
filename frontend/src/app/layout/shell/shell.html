<div class="shell" [class.sidebar-closed]="!sidebarOpen()" [class.mobile]="isMobile()">
  <app-sidebar class="sidebar" [attr.inert]="sidebarOpen() ? null : ''" (collapse)="toggleSidebar()" />

  @if (isMobile() && sidebarOpen()) {
    <div class="backdrop" (click)="toggleSidebar()" aria-hidden="true"></div>
  }

  <main class="main">
    @if (!sidebarOpen()) {
      <button class="open-sidebar" type="button" (click)="toggleSidebar()" aria-label="Open sidebar" title="Open sidebar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="16" rx="3" />
          <path d="M9 4v16" />
        </svg>
      </button>
    }
    <router-outlet />
  </main>
</div>

<app-premium-dialog />
