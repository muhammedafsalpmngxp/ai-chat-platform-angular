<main class="login">
  <form class="card" (submit)="submit($event)" novalidate>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3c4.97 0 9 3.58 9 8s-4.03 8-9 8c-1.1 0-2.15-.17-3.12-.5L4 20l1.2-3.6C3.83 15 3 13.1 3 11c0-4.42 4.03-8 9-8z" />
      </svg>
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to continue to AI Chatbot</p>

    <label class="field">
      <span>Username</span>
      <input
        type="text"
        name="username"
        autocomplete="username"
        autofocus
        [value]="username()"
        (input)="username.set(value($event))"
      />
    </label>

    <label class="field">
      <span>Password</span>
      <div class="password">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="current-password"
          [value]="password()"
          (input)="password.set(value($event))"
        />
        <button
          type="button"
          class="toggle"
          (click)="showPassword.set(!showPassword())"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
    </label>

    @if (error(); as message) {
      <p class="error" role="alert">{{ message }}</p>
    }

    <button class="submit" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>
</main>
